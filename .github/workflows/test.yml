# Tests on Ubuntu. Does not publish.
# npm publish on GitHub Release lives only in npm-publish.yml.

name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run audit
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
